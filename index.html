<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>School Planner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#1f2937;color:#fff;text-align:center;padding:22px 14px}
header h1{margin:0;font-size:28px} header p{margin:6px 0 0;color:#d1d5db}
main{max-width:1200px;margin:0 auto;padding:14px}
.panel{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:14px}
.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
label{display:block;font-size:13px;font-weight:700;color:#4b5563;margin-bottom:5px}
select,button{width:100%;min-height:46px;border:1px solid #d1d5db;border-radius:10px;padding:9px 11px;font-size:16px;background:#fff}
button{background:#374151;color:#fff;border:0;font-weight:700;cursor:pointer;padding-left:18px;padding-right:18px}
.status{margin:12px 0 0;color:#4b5563;font-size:14px}
.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.subject{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.subject h2{margin:0;padding:13px 15px;background:#e5e7eb;font-size:18px}
.card{margin:10px;padding:12px;border:1px solid #e5e7eb;border-radius:11px;background:#fafafa}
.card.holiday{background:#fff7ed;border-color:#fed7aa}
.date{font-size:13px;font-weight:700;color:#4b5563;margin-bottom:5px}
.holiday .date{color:#c2410c}
.task{font-size:15px;line-height:1.4}
.empty{padding:25px;text-align:center;color:#6b7280;background:#fff;border-radius:14px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.calendar-head h2{margin:0;font-size:20px}
.calendar-month{max-width:230px}
.calendar-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));min-width:735px;border-top:1px solid #e5e7eb;border-left:1px solid #e5e7eb}
.weekday,.day{border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb}
.weekday{padding:8px;text-align:center;font-size:13px;font-weight:700;background:#f9fafb}
.day{min-height:105px;padding:7px;background:#fff;vertical-align:top}
.day-number{font-size:13px;font-weight:700;color:#374151}
.event{margin-top:5px;padding:5px 6px;border-radius:7px;background:#eef2ff;font-size:11px;line-height:1.25;word-break:break-word}
.event.holiday{background:#fff7ed;color:#9a3412}
.note{font-size:12px;color:#6b7280;margin-top:10px}
@media(max-width:650px){
  header h1{font-size:24px}
  main{padding:10px}
  .filters{grid-template-columns:1fr}
  .calendar-month{max-width:none}
}
</style>
</head>
<body>
<header><h1>📚 School Planner</h1><p>Tasks, appointments and holidays</p></header>

<main>
<section class="panel">
  <div class="filters">
    <div>
      <label for="subjectFilter">Subject</label>
      <select id="subjectFilter"><option value="ALL">All subjects</option></select>
    </div>
    <div>
      <label for="monthFilter">Date / Month</label>
      <select id="monthFilter"><option value="ALL">All dates</option></select>
    </div>
    <div><button id="reset" type="button">Reset filters</button></div>
  </div>
  <div id="status" class="status" aria-live="polite"></div>
</section>

<div id="taskArea"></div>

<section class="panel">
  <div class="calendar-head">
    <h2>Calendar</h2>
    <div class="calendar-month">
      <label for="calendarMonth">Calendar month</label>
      <select id="calendarMonth"></select>
    </div>
  </div>
  <div class="calendar-scroll"><div id="calendar" class="calendar"></div></div>
  <div class="note">🟠 Holidays are highlighted. Select a month above to change the calendar.</div>
</section>
</main>

<script>
"use strict";

const DATA = [{"subject": "Integrated science", "date": "2026-09-23", "task": "Solar system and universe"}, {"subject": "Integrated science", "date": "2026-09-28", "task": "Day and night"}, {"subject": "Integrated science", "date": "2026-10-07", "task": "Light and reflexion"}, {"subject": "Integrated science", "date": "2026-10-14", "task": "Moon, shadows and eclipse"}, {"subject": "Integrated science", "date": "2026-10-21", "task": "Shadow formation"}, {"subject": "Integrated science", "date": "2026-10-28", "task": "Life on earth"}, {"subject": "Human science", "date": "2026-09-25", "task": "Introduction"}, {"subject": "Human science", "date": "2026-10-05", "task": "River systems"}, {"subject": "Human science", "date": "2026-10-12", "task": "Erosion"}, {"subject": "Human science", "date": "2026-10-23", "task": "Revision"}, {"subject": "Maths", "date": "", "task": ""}, {"subject": "English", "date": "2026-09-22", "task": "Discovering short stories"}, {"subject": "English", "date": "2026-10-02", "task": "Building suspense"}, {"subject": "English", "date": "2026-10-09", "task": "When wishes go wrong"}, {"subject": "English", "date": "2026-10-16", "task": "Seeing the story differently"}, {"subject": "English", "date": "2026-10-23", "task": "Creating a different world"}, {"subject": "English", "date": "2026-10-29", "task": "The story of an hour"}, {"subject": "English", "date": "2026-10-30", "task": "Correction work and self evaluation"}, {"subject": "French", "date": "2026-09-22", "task": "La France et les clichés"}, {"subject": "French", "date": "", "task": "La France et les habitudes"}, {"subject": "French", "date": "", "task": "Les repas en France"}, {"subject": "French", "date": "", "task": "Test de vérification (temps/partitifs/vocabulaire)"}, {"subject": "French", "date": "", "task": "La France et la cuisine"}, {"subject": "French", "date": "2026-10-27", "task": "Semaine du gout"}, {"subject": "German", "date": "", "task": ""}, {"subject": "Luxembourgish", "date": "2026-09-25", "task": "Begréissungsformelen"}, {"subject": "Luxembourgish", "date": "2026-10-02", "task": "D'verb hunn an de bestëmmten Artikel"}, {"subject": "Luxembourgish", "date": "2026-10-09", "task": "D'n Reegel an d'Lokalprepositiounen"}, {"subject": "Luxembourgish", "date": "2026-10-16", "task": "Länner, Leit a Sproochen"}, {"subject": "Luxembourgish", "date": "2026-10-23", "task": "D'Zuelen an den Alter"}, {"subject": "→Private appointments", "date": "2026-11-05", "task": "Vorpahl dentiste"}, {"subject": "→Private appointments", "date": "2026-11-18", "task": "Klos ophta"}, {"subject": "→Holidays", "date": "2026-11-02", "task": ""}, {"subject": "→Holidays", "date": "2026-11-03", "task": ""}, {"subject": "→Holidays", "date": "2026-11-04", "task": ""}, {"subject": "→Holidays", "date": "2026-11-05", "task": ""}, {"subject": "→Holidays", "date": "2026-11-06", "task": ""}, {"subject": "→Holidays", "date": "2026-12-21", "task": ""}, {"subject": "→Holidays", "date": "2026-12-22", "task": ""}, {"subject": "→Holidays", "date": "2026-12-23", "task": ""}, {"subject": "→Holidays", "date": "2026-12-24", "task": ""}, {"subject": "→Holidays", "date": "2026-12-25", "task": ""}, {"subject": "→Holidays", "date": "2026-12-26", "task": ""}, {"subject": "→Holidays", "date": "2026-12-27", "task": ""}, {"subject": "→Holidays", "date": "2026-12-28", "task": ""}, {"subject": "→Holidays", "date": "2026-12-29", "task": ""}, {"subject": "→Holidays", "date": "2026-12-30", "task": ""}, {"subject": "→Holidays", "date": "2026-12-31", "task": ""}, {"subject": "→Holidays", "date": "2027-01-01", "task": ""}, {"subject": "→Holidays", "date": "2027-02-03", "task": ""}, {"subject": "→Holidays", "date": "2027-02-04", "task": ""}, {"subject": "→Holidays", "date": "2027-02-05", "task": ""}, {"subject": "→Holidays", "date": "2027-02-06", "task": ""}, {"subject": "→Holidays", "date": "2027-02-07", "task": ""}, {"subject": "→Holidays", "date": "2027-02-08", "task": ""}, {"subject": "→Holidays", "date": "2027-02-09", "task": ""}, {"subject": "→Holidays", "date": "2027-02-10", "task": ""}, {"subject": "→Holidays", "date": "2027-02-11", "task": ""}, {"subject": "→Holidays", "date": "2027-02-12", "task": ""}, {"subject": "→Holidays", "date": "2027-02-13", "task": ""}, {"subject": "→Holidays", "date": "2027-02-14", "task": ""}, {"subject": "→Holidays", "date": "2027-03-29", "task": ""}, {"subject": "→Holidays", "date": "2027-03-30", "task": ""}, {"subject": "→Holidays", "date": "2027-03-31", "task": ""}, {"subject": "→Holidays", "date": "2027-04-01", "task": ""}, {"subject": "→Holidays", "date": "2027-04-02", "task": ""}, {"subject": "→Holidays", "date": "2027-04-03", "task": ""}, {"subject": "→Holidays", "date": "2027-04-04", "task": ""}, {"subject": "→Holidays", "date": "2027-04-05", "task": ""}, {"subject": "→Holidays", "date": "2027-04-06", "task": ""}, {"subject": "→Holidays", "date": "2027-04-07", "task": ""}, {"subject": "→Holidays", "date": "2027-04-08", "task": ""}, {"subject": "→Holidays", "date": "2027-04-09", "task": ""}, {"subject": "→Holidays", "date": "2027-04-10", "task": ""}, {"subject": "→Holidays", "date": "2027-04-11", "task": ""}, {"subject": "→Holidays", "date": "2027-05-06", "task": ""}, {"subject": "→Holidays", "date": "2027-05-17", "task": ""}, {"subject": "→Holidays", "date": "2027-05-29", "task": ""}, {"subject": "→Holidays", "date": "2027-05-30", "task": ""}, {"subject": "→Holidays", "date": "2027-05-31", "task": ""}, {"subject": "→Holidays", "date": "2027-06-01", "task": ""}, {"subject": "→Holidays", "date": "2027-06-02", "task": ""}, {"subject": "→Holidays", "date": "2027-06-03", "task": ""}, {"subject": "→Holidays", "date": "2027-06-04", "task": ""}, {"subject": "→Holidays", "date": "2027-06-05", "task": ""}, {"subject": "→Holidays", "date": "2027-06-06", "task": ""}, {"subject": "→Holidays", "date": "2027-06-23", "task": ""}];
const SUBJECTS = ["Integrated science", "Human science", "Maths", "English", "French", "German", "Luxembourgish", "→Private appointments", "→Holidays"];

const subjectFilter = document.getElementById("subjectFilter");
const monthFilter = document.getElementById("monthFilter");
const calendarMonth = document.getElementById("calendarMonth");
const taskArea = document.getElementById("taskArea");
const calendar = document.getElementById("calendar");
const status = document.getElementById("status");

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(ch) {
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[ch];
  });
}

function parseDate(value) {
  if (!value) return null;
  const s = String(value).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  const d = new Date(Date.UTC(Number(m[1]), Number(m[2])-1, Number(m[3])));
  return isNaN(d.getTime()) ? null : d;
}

function monthKey(d) {
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0");
}

function monthLabel(key) {
  const p = key.split("-");
  const d = new Date(Date.UTC(Number(p[0]), Number(p[1])-1, 1));
  return d.toLocaleDateString("en-GB", {month:"long", year:"numeric", timeZone:"UTC"});
}

function displayDate(value) {
  const d = parseDate(value);
  if (!d) return value || "Date not set";
  return d.toLocaleDateString("en-GB", {
    day:"2-digit", month:"short", year:"numeric", timeZone:"UTC"
  });
}

function isHoliday(subject) {
  return String(subject).toLowerCase().includes("holiday");
}

/* Build subject filter */
SUBJECTS.forEach(function(subject) {
  const option = document.createElement("option");
  option.value = subject;
  option.textContent = subject;
  subjectFilter.appendChild(option);
});

/* Build month/date filter from the Excel dates */
const monthKeys = Array.from(new Set(
  DATA.map(x => parseDate(x.date)).filter(Boolean).map(monthKey)
)).sort();

monthKeys.forEach(function(key) {
  const option = document.createElement("option");
  option.value = key;
  option.textContent = monthLabel(key);
  monthFilter.appendChild(option);

  const calendarOption = document.createElement("option");
  calendarOption.value = key;
  calendarOption.textContent = monthLabel(key);
  calendarMonth.appendChild(calendarOption);
});

if (monthKeys.length) calendarMonth.value = monthKeys[0];

function getFilteredItems() {
  const subject = subjectFilter.value;
  const month = monthFilter.value;

  return DATA.filter(function(item) {
    const d = parseDate(item.date);
    const subjectOK = subject === "ALL" || item.subject === subject;
    const monthOK = month === "ALL" || (d && monthKey(d) === month);
    return subjectOK && monthOK;
  });
}

function renderTasks() {
  const items = getFilteredItems();
  status.textContent = items.length + (items.length === 1 ? " item" : " items") + " shown";

  if (!items.length) {
    taskArea.innerHTML = '<div class="empty">No tasks match the selected filters.</div>';
    return;
  }

  const groups = new Map();
  items.forEach(function(item) {
    if (!groups.has(item.subject)) groups.set(item.subject, []);
    groups.get(item.subject).push(item);
  });

  let html = '<div class="columns">';
  groups.forEach(function(group, subject) {
    html += '<section class="subject">';
    html += '<h2>' + escapeHtml(subject) + '</h2>';

    group.forEach(function(item) {
      html += '<div class="card' + (isHoliday(item.subject) ? ' holiday' : '') + '">';
      html += '<div class="date">' + escapeHtml(displayDate(item.date)) + '</div>';
      html += '<div class="task">' + (item.task ? escapeHtml(item.task) : '<em>No task specified</em>') + '</div>';
      html += '</div>';
    });

    html += '</section>';
  });
  html += '</div>';

  taskArea.innerHTML = html;
}

function renderCalendar() {
  const key = calendarMonth.value;
  if (!key) {
    calendar.innerHTML = "";
    return;
  }

  const parts = key.split("-");
  const year = Number(parts[0]);
  const month = Number(parts[1]) - 1;

  const first = new Date(Date.UTC(year, month, 1));
  const last = new Date(Date.UTC(year, month + 1, 0));
  const firstWeekdayMondayBased = (first.getUTCDay() + 6) % 7;

  let html = "";
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(day) {
    html += '<div class="weekday">' + day + '</div>';
  });

  for (let i = 0; i < firstWeekdayMondayBased; i++) {
    html += '<div class="day"></div>';
  }

  for (let dayNumber = 1; dayNumber <= last.getUTCDate(); dayNumber++) {
    const current = new Date(Date.UTC(year, month, dayNumber));
    const keyDate = current.toISOString().slice(0,10);

    const dayItems = DATA.filter(function(item) {
      const d = parseDate(item.date);
      return d && d.toISOString().slice(0,10) === keyDate;
    });

    html += '<div class="day">';
    html += '<div class="day-number">' + dayNumber + '</div>';

    dayItems.forEach(function(item) {
      html += '<div class="event' + (isHoliday(item.subject) ? ' holiday' : '') + '">';
      html += '<strong>' + escapeHtml(item.subject) + '</strong>';
      if (item.task) html += ' — ' + escapeHtml(item.task);
      html += '</div>';
    });

    html += '</div>';
  }

  const used = firstWeekdayMondayBased + last.getUTCDate();
  const total = Math.ceil(used / 7) * 7;
  for (let i = used; i < total; i++) html += '<div class="day"></div>';

  calendar.innerHTML = html;
}

subjectFilter.addEventListener("change", renderTasks);
monthFilter.addEventListener("change", renderTasks);
calendarMonth.addEventListener("change", renderCalendar);

document.getElementById("reset").addEventListener("click", function() {
  subjectFilter.value = "ALL";
  monthFilter.value = "ALL";
  if (monthKeys.length) calendarMonth.value = monthKeys[0];
  renderTasks();
  renderCalendar();
});

renderTasks();
renderCalendar();
</script>
</body>
</html>
