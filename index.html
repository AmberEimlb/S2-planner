<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f2937">
<title>School Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f4f6;color:#1f2937}
header{background:#1f2937;color:white;padding:22px 16px;text-align:center}header h1{margin:0;font-size:28px}header p{margin:6px 0 0;color:#d1d5db}
.container{max-width:1200px;margin:auto;padding:16px}.controls{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0001;display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.control{flex:1;min-width:170px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:#4b5563}
select,button{width:100%;min-height:44px;border:1px solid #d1d5db;border-radius:10px;background:white;padding:8px 11px;font-size:16px}button{background:#374151;color:white;border:0;font-weight:700;cursor:pointer}
.summary{margin:14px 0;font-size:14px;color:#4b5563}.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.subject{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0001}.subject h2{margin:0;padding:13px 15px;background:#e5e7eb;font-size:18px}
.card{margin:10px;padding:12px;border:1px solid #e5e7eb;border-radius:11px;background:#fafafa}.card .date{font-size:13px;font-weight:700;color:#4b5563;margin-bottom:5px}.card .task{font-size:15px;line-height:1.35}
.holiday{background:#fff7ed;border-color:#fed7aa}.holiday .date{color:#c2410c}.empty{padding:22px;text-align:center;color:#6b7280}
.calendarWrap{margin-top:18px;background:white;border-radius:14px;box-shadow:0 2px 10px #0001;padding:14px;overflow:auto}.calendarHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.calendarHead h2{margin:0;font-size:20px}
.calendarGrid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));min-width:770px;border-top:1px solid #e5e7eb;border-left:1px solid #e5e7eb}.weekday,.day{border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb}.weekday{padding:8px;text-align:center;font-weight:700;background:#f9fafb;font-size:13px}.day{min-height:100px;padding:7px;background:white}.daynum{font-weight:700;font-size:13px;color:#374151}
.event{margin-top:5px;padding:5px 6px;border-radius:7px;background:#eef2ff;font-size:11px;line-height:1.25}.event.holidayEvent{background:#fff7ed;color:#9a3412}.legend{margin-top:12px;font-size:12px;color:#6b7280}
@media(max-width:600px){header h1{font-size:24px}.container{padding:10px}.controls{padding:10px}.control{min-width:100%}.columns{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>📚 School Planner</h1><p>Tasks, appointments and holidays</p></header>
<div class="container">
<div class="controls">
<div class="control"><label for="subject">Subject</label><select id="subject"><option value="all">All subjects</option></select></div>
<div class="control"><label for="month">Month</label><select id="month"><option value="all">All months</option></select></div>
<div class="control"><button id="reset" type="button">Reset filters</button></div>
</div>
<div id="summary" class="summary"></div><div id="columns" class="columns"></div>
<div class="calendarWrap"><div class="calendarHead"><h2>Calendar</h2><div class="control" style="max-width:220px"><select id="calMonth" aria-label="Calendar month"></select></div></div><div id="calendar"></div>
<div class="legend">🟠 Holidays &nbsp; • &nbsp; Dates without a task are still shown in the calendar.</div></div>
</div>
<script>
'use strict';
const DATA=[{"subject": "Integrated science", "date": "2026-09-23", "task": "Solar system and universe"}, {"subject": "Integrated science", "date": "2026-09-28", "task": "Day and night"}, {"subject": "Integrated science", "date": "2026-10-07", "task": "Light and reflexion"}, {"subject": "Integrated science", "date": "2026-10-14", "task": "Moon, shadows and eclipse"}, {"subject": "Integrated science", "date": "2026-10-21", "task": "Shadow formation"}, {"subject": "Integrated science", "date": "2026-10-28", "task": "Life on earth"}, {"subject": "Human science", "date": "2026-09-25", "task": "Introduction"}, {"subject": "Human science", "date": "2026-10-05", "task": "River systems"}, {"subject": "Human science", "date": "2026-10-12", "task": "Erosion"}, {"subject": "Human science", "date": "2026-10-23", "task": "Revision"}, {"subject": "Maths", "date": "", "task": ""}, {"subject": "English", "date": "2026-09-22", "task": "Discovering short stories"}, {"subject": "English", "date": "2026-10-02", "task": "Building suspense"}, {"subject": "English", "date": "2026-10-09", "task": "When wishes go wrong"}, {"subject": "English", "date": "2026-10-16", "task": "Seeing the story differently"}, {"subject": "English", "date": "2026-10-23", "task": "Creating a different world"}, {"subject": "English", "date": "2026-10-29", "task": "The story of an hour"}, {"subject": "English", "date": "2026-10-30", "task": "Correction work and self evaluation"}, {"subject": "French", "date": "2026-09-22", "task": "La France et les clichés"}, {"subject": "French", "date": "", "task": "La France et les habitudes"}, {"subject": "French", "date": "", "task": "Les repas en France"}, {"subject": "French", "date": "", "task": "Test de vérification (temps/partitifs/vocabulaire)"}, {"subject": "French", "date": "", "task": "La France et la cuisine"}, {"subject": "French", "date": "21/10/2026-27/10/2026", "task": "Semaine du gout"}, {"subject": "German", "date": "", "task": ""}, {"subject": "Luxembourgish", "date": "2026-09-25", "task": "Begréissungsformelen"}, {"subject": "Luxembourgish", "date": "2026-10-02", "task": "D'verb hunn an de bestëmmten Artikel"}, {"subject": "Luxembourgish", "date": "2026-10-09", "task": "D'n Reegel an d'Lokalprepositiounen"}, {"subject": "Luxembourgish", "date": "2026-10-16", "task": "Länner, Leit a Sproochen"}, {"subject": "Luxembourgish", "date": "2026-10-23", "task": "D'Zuelen an den Alter"}, {"subject": "→Private appointments", "date": "2026-11-05", "task": "Vorpahl dentiste"}, {"subject": "→Private appointments", "date": "2026-11-18", "task": "Klos ophta"}, {"subject": "→Holidays", "date": "2026-11-02", "task": ""}, {"subject": "→Holidays", "date": "2026-11-03", "task": ""}, {"subject": "→Holidays", "date": "2026-11-04", "task": ""}, {"subject": "→Holidays", "date": "2026-11-05", "task": ""}, {"subject": "→Holidays", "date": "2026-11-06", "task": ""}, {"subject": "→Holidays", "date": "2026-12-21", "task": ""}, {"subject": "→Holidays", "date": "2026-12-22", "task": ""}, {"subject": "→Holidays", "date": "2026-12-23", "task": ""}, {"subject": "→Holidays", "date": "2026-12-24", "task": ""}, {"subject": "→Holidays", "date": "2026-12-25", "task": ""}, {"subject": "→Holidays", "date": "2026-12-26", "task": ""}, {"subject": "→Holidays", "date": "2026-12-27", "task": ""}, {"subject": "→Holidays", "date": "2026-12-28", "task": ""}, {"subject": "→Holidays", "date": "2026-12-29", "task": ""}, {"subject": "→Holidays", "date": "2026-12-30", "task": ""}, {"subject": "→Holidays", "date": "2026-12-31", "task": ""}, {"subject": "→Holidays", "date": "2027-01-01", "task": ""}, {"subject": "→Holidays", "date": "2027-02-03", "task": ""}, {"subject": "→Holidays", "date": "2027-02-04", "task": ""}, {"subject": "→Holidays", "date": "2027-02-05", "task": ""}, {"subject": "→Holidays", "date": "2027-02-06", "task": ""}, {"subject": "→Holidays", "date": "2027-02-07", "task": ""}, {"subject": "→Holidays", "date": "2027-02-08", "task": ""}, {"subject": "→Holidays", "date": "2027-02-09", "task": ""}, {"subject": "→Holidays", "date": "2027-02-10", "task": ""}, {"subject": "→Holidays", "date": "2027-02-11", "task": ""}, {"subject": "→Holidays", "date": "2027-02-12", "task": ""}, {"subject": "→Holidays", "date": "2027-02-13", "task": ""}, {"subject": "→Holidays", "date": "2027-02-14", "task": ""}, {"subject": "→Holidays", "date": "2027-03-29", "task": ""}, {"subject": "→Holidays", "date": "2027-03-30", "task": ""}, {"subject": "→Holidays", "date": "2027-03-31", "task": ""}, {"subject": "→Holidays", "date": "2027-04-01", "task": ""}, {"subject": "→Holidays", "date": "2027-04-02", "task": ""}, {"subject": "→Holidays", "date": "2027-04-03", "task": ""}, {"subject": "→Holidays", "date": "2027-04-04", "task": ""}, {"subject": "→Holidays", "date": "2027-04-05", "task": ""}, {"subject": "→Holidays", "date": "2027-04-06", "task": ""}, {"subject": "→Holidays", "date": "2027-04-07", "task": ""}, {"subject": "→Holidays", "date": "2027-04-08", "task": ""}, {"subject": "→Holidays", "date": "2027-04-09", "task": ""}, {"subject": "→Holidays", "date": "2027-04-10", "task": ""}, {"subject": "→Holidays", "date": "2027-04-11", "task": ""}, {"subject": "→Holidays", "date": "2027-05-06", "task": ""}, {"subject": "→Holidays", "date": "2027-05-17", "task": ""}, {"subject": "→Holidays", "date": "2027-05-29", "task": ""}, {"subject": "→Holidays", "date": "2027-05-30", "task": ""}, {"subject": "→Holidays", "date": "2027-05-31", "task": ""}, {"subject": "→Holidays", "date": "2027-06-01", "task": ""}, {"subject": "→Holidays", "date": "2027-06-02", "task": ""}, {"subject": "→Holidays", "date": "2027-06-03", "task": ""}, {"subject": "→Holidays", "date": "2027-06-04", "task": ""}, {"subject": "→Holidays", "date": "2027-06-05", "task": ""}, {"subject": "→Holidays", "date": "2027-06-06", "task": ""}, {"subject": "→Holidays", "date": "2027-06-23", "task": ""}];
const SUBJECTS=["Integrated science", "Human science", "Maths", "English", "French", "German", "Luxembourgish", "→Private appointments", "→Holidays"];
const subjectEl=document.getElementById('subject'),monthEl=document.getElementById('month'),calMonthEl=document.getElementById('calMonth');
const columnsEl=document.getElementById('columns'),summaryEl=document.getElementById('summary'),calendarEl=document.getElementById('calendar');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);}
function parseDate(v){
 if(!v)return null; const s=String(v).trim();
 let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
 m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m)return new Date(Date.UTC(+m[3],+m[2]-1,+m[1]));
 m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m)return new Date(Date.UTC(+m[3],+m[2]-1,+m[1]));
 return null;
}
function isRange(v){return (String(v||'').match(/\d{1,2}\/\d{1,2}\/\d{4}/g)||[]).length>1;}
function displayDate(v){const s=String(v||'').trim();if(!s)return'Date not set';if(isRange(s))return s.replace('-', ' – ');const d=parseDate(s);return d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}):s;}
function monthKey(d){return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');}
function monthLabel(k){const [y,m]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});}
SUBJECTS.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s.replace(/^→/,'');subjectEl.appendChild(o);});
const monthSet=new Set();DATA.forEach(x=>{const d=parseDate(x.date);if(d)monthSet.add(monthKey(d));});
const months=[...monthSet].sort();
months.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=monthLabel(k);monthEl.appendChild(o);o=o.cloneNode(true);calMonthEl.appendChild(o);});
const firstMonth=months[0]||'';calMonthEl.value=firstMonth;
function filtered(){const s=subjectEl.value,m=monthEl.value;return DATA.filter(x=>{const d=parseDate(x.date);return(s==='all'||x.subject===s)&&(m==='all'||(d&&monthKey(d)===m));});}
function render(){
 const rows=filtered();summaryEl.textContent=`${rows.length} item${rows.length===1?'':'s'} shown`;columnsEl.innerHTML='';
 const groups=[];rows.forEach(x=>{let g=groups.find(a=>a.subject===x.subject);if(!g){g={subject:x.subject,items:[]};groups.push(g);}g.items.push(x);});
 groups.forEach(g=>{const box=document.createElement('section');box.className='subject';const h=document.createElement('h2');h.textContent=g.subject.replace(/^→/,'');box.appendChild(h);
 g.items.forEach(x=>{const c=document.createElement('div');c.className='card'+(x.subject.includes('Holidays')?' holiday':'');c.innerHTML=`<div class="date">${esc(displayDate(x.date))}</div><div class="task">${x.task?esc(x.task):'<em>No task specified</em>'}</div>`;box.appendChild(c);});columnsEl.appendChild(box);});
 if(!groups.length)columnsEl.innerHTML='<div class="empty">No items match the selected filters.</div>';
}
function renderCalendar(){
 const key=calMonthEl.value;if(!key){calendarEl.innerHTML='';return;}const [y,m]=key.split('-').map(Number);
 const first=new Date(Date.UTC(y,m-1,1)),last=new Date(Date.UTC(y,m,0));let out='<div class="calendarGrid">';
 ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(w=>out+=`<div class="weekday">${w}</div>`);
 const start=(first.getUTCDay()+6)%7;for(let i=0;i<start;i++)out+='<div class="day"></div>';
 for(let n=1;n<=last.getUTCDate();n++){const d=new Date(Date.UTC(y,m-1,n)),kd=d.toISOString().slice(0,10);const items=DATA.filter(x=>{const pd=parseDate(x.date);return pd&&pd.toISOString().slice(0,10)===kd;});
 out+=`<div class="day"><div class="daynum">${n}</div>`;items.forEach(x=>{out+=`<div class="event ${x.subject.includes('Holidays')?'holidayEvent':''}"><strong>${esc(x.subject.replace(/^→/,'') )}</strong>${x.task?' — '+esc(x.task):''}</div>`;});out+='</div>';}
 const cells=start+last.getUTCDate();for(let i=cells;i<Math.ceil(cells/7)*7;i++)out+='<div class="day"></div>';out+='</div>';calendarEl.innerHTML=out;
}
subjectEl.addEventListener('change',render);monthEl.addEventListener('change',render);calMonthEl.addEventListener('change',renderCalendar);
document.getElementById('reset').addEventListener('click',()=>{subjectEl.value='all';monthEl.value='all';calMonthEl.value=firstMonth;render();renderCalendar();});
render();renderCalendar();
</script>
</body></html>
